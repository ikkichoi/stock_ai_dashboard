name: Daily S&P 500 OE Research Sync

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install dependencies
        run: |

      - name: 4. Run SEC TTM and AI research pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_SLEEP_SEC: "6.5"
          MAX_WORKERS: "1"
        run: |
          python -c "from collector import run_ai_pipeline_once; run_ai_pipeline_once(limit=35)"
      - name: 5. 텔레그램 저평가 Top 5 일일 리포트 발송
        env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notifier.py